name: Guard CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    name: Go guard static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: tests
        run: CGO_ENABLED=0 go test ./... -count=1
      - name: Linux builds
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ./cmd/subdomainwatch-guard
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build ./cmd/subdomainwatch-guard
